name: Fix Lagos CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run domain, Phase 1, Phase 2, Phase 3, Phase 4, EXIF & WCAG 2.2 AA tests
        run: npx --yes tsx --test lib/domain.test.ts lib/phase1.test.ts lib/phase2.test.ts lib/phase3.test.ts lib/phase4.test.ts
      - name: Run ESLint & TypeScript checks
        run: npm run lint
      - name: Build Next.js PWA bundle
        run: npm run build
